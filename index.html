<style>
  :root {
    --bg: #0A0A0A;
    --panel: #151515;
    --panel-2: #1B1B1B;
    --ink: #E4E4E5;
    --accent: #72BD03;
    --accent-dim: #4d8002;
    --line: #2A2A2A;
    --danger: #E0533D;
    --muted: #8C8C8E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(180deg, rgba(114,189,3,0.05), transparent 220px);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, Inter, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 110px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .brandmark { display: flex; align-items: center; gap: 12px; }
  .brand-logo { height: 46px; width: auto; display: block; flex-shrink: 0; }
  .eyebrow {
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
  }
  h1 { font-size: 24px; margin: 2px 0 0; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
  .tagline {
    font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    margin: 18px 0 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .tagline b { color: var(--accent); font-weight: 700; }
  .stamp-icon {
    width: 52px; height: 52px; border-radius: 10px; border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 22px; flex-shrink: 0;
    background: linear-gradient(145deg, rgba(114,189,3,0.12), transparent);
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 22px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.field-label {
    display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px; font-weight: 600;
  }
  input[type=date], input[type=number], input[type=text], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 14px; background: var(--panel-2); color: var(--ink); font-family: inherit;
  }
  input::-webkit-calendar-picker-indicator { filter: invert(1) brightness(1.6); }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 56px; resize: vertical; }
  .field { margin-top: 12px; }
  .field:first-child { margin-top: 0; }
  #photoPreview { margin-top: 10px; max-height: 140px; border-radius: 6px; border: 1px solid var(--line); display: none; }
  .photo-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px dashed var(--accent-dim); border-radius: 8px; padding: 12px;
    color: var(--accent); font-weight: 600; background: transparent; font-size: 14px;
    font-family: inherit; cursor: pointer;
  }
  .photo-btn.filled { background: rgba(114,189,3,0.1); border-color: var(--accent); }
  .submit-btn {
    margin-top: 16px; width: 100%; padding: 13px; background: var(--accent); color: #0A0A0A;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 700; letter-spacing: .02em;
    cursor: pointer; font-family: inherit;
  }
  .submit-btn:disabled { opacity: .5; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .total-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .total-value { font-size: 22px; font-weight: 700; color: var(--ink); }
  .export-btn {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--accent);
    color: #0A0A0A; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .export-btn:disabled { opacity: .4; cursor: not-allowed; }
  .empty, .loading {
    text-align: center; padding: 40px 20px; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 10px;
  }
  .banner {
    display: flex; gap: 8px; align-items: center; border-radius: 8px; padding: 10px 12px;
    font-size: 13px; margin-bottom: 16px; border: 1px solid;
  }
  .banner.ok { background: rgba(114,189,3,0.12); border-color: var(--accent); color: var(--accent); }
  .banner.err { background: rgba(224,83,61,0.12); border-color: var(--danger); color: var(--danger); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; gap: 12px; }
  .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; cursor: pointer; flex-shrink: 0; border: 1px solid var(--line); }
  .thumb-empty {
    width: 56px; height: 56px; border-radius: 6px; background: var(--panel-2); display: flex;
    align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; font-size: 20px;
    border: 1px solid var(--line);
  }
  .row-body { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .row-title { font-weight: 700; color: var(--ink); }
  .row-value { font-weight: 700; white-space: nowrap; color: var(--accent); }
  .row-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-obs { font-size: 13px; margin-top: 4px; color: var(--ink); opacity: .85; }
  .row-actions { display: flex; gap: 14px; margin-top: 8px; }
  .link-btn {
    display: flex; align-items: center; gap: 4px; background: none; border: none; padding: 0;
    font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; font-family: inherit;
  }
  .link-btn.danger { color: var(--danger); }
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightbox .close-btn {
    position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff;
    font-size: 28px; cursor: pointer;
  }
</style>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<div class="wrap">

      <div>
        <div class="eyebrow">Livro-caixa</div>
        <h1>Registro de Despesas</h1>
      </div>
    </div>
  </header>
  <div class="tagline">Conexão que <b>Gera Valor</b></div>

  <div id="banner" class="banner" style="display:none;"></div>

  <div class="card">
    <div class="grid2">
      <div class="field">
        <label class="field-label">Data</label>
        <input type="date" id="fData" />
      </div>
      <div class="field">
        <label class="field-label">Valor</label>
        <input type="number" step="0.01" inputmode="decimal" placeholder="0,00" id="fValor" />
      </div>
    </div>
    <div class="field">
      <label class="field-label">Despesa</label>
      <input type="text" placeholder="Ex: Combustível, Adubo, Frete..." id="fDespesa" />
    </div>
    <div class="field">
      <label class="field-label">Observação</label>
      <textarea placeholder="Detalhes adicionais (opcional)" id="fObs"></textarea>
    </div>
    <div class="field">
      <label class="field-label">Comprovante</label>
      <input type="file" accept="image/*" capture="environment" id="fPhotoCamera" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0,0,0,0);" />
      <input type="file" accept="image/*" id="fPhotoGaleria" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0,0,0,0);" />
      <div style="display:flex; gap:8px;">
        <label class="photo-btn" id="photoBtnCamera" for="fPhotoCamera" style="flex:1;">📷 Tirar foto</label>
        <label class="photo-btn" id="photoBtnGaleria" for="fPhotoGaleria" style="flex:1;">🖼️ Galeria/Arquivos</label>
      </div>
      <img id="photoPreview" />
      <div id="ocrStatus" style="display:none; margin-top:8px; font-size:13px; color: var(--muted);"></div>
    </div>
    <button type="button" class="submit-btn" id="submitBtn">Registrar despesa</button>
  </div>

  <div class="toolbar">
    <div>
      <div class="total-label">Total lançado</div>
      <div class="total-value" id="totalValue">R$ 0,00</div>
    </div>
    <button type="button" class="export-btn" id="exportBtn" disabled>📊 Exportar Excel</button>
  </div>
  <div class="toolbar" style="margin-top:-6px;">
    <button type="button" class="link-btn" id="backupBtn">💾 Baixar backup</button>
    <input type="file" accept="application/json" id="restoreInput" style="display:none;" />
    <button type="button" class="link-btn" id="restoreBtn">📂 Carregar backup</button>
  </div>

  <div id="listArea"></div>
</div>

<div id="lightbox">
  <button class="close-btn" id="closeLightbox">✕</button>
  <img id="lightboxImg" />
</div>

<script>
  const STORE_KEY = "despesas_registros_v1";
  let records = [];
  let pendingPhoto = null;
  let confirmDeleteId = null;

  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function formatBRL(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function showBanner(type, text) {
    const b = document.getElementById("banner");
    b.className = "banner " + (type === "ok" ? "ok" : "err");
    b.textContent = text;
    b.style.display = "flex";
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { b.style.display = "none"; }, 3500);
  }
  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      records = raw ? JSON.parse(raw) : [];
    } catch (e) {
      records = [];
    }
  }
  function saveRecords() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
      return true;
    } catch (e) {
      return false;
    }
  }

  function resetForm() {
    document.getElementById("fData").value = todayISO();
    document.getElementById("fDespesa").value = "";
    document.getElementById("fObs").value = "";
    document.getElementById("fValor").value = "";
    document.getElementById("fPhotoCamera").value = "";
    document.getElementById("fPhotoGaleria").value = "";
    pendingPhoto = null;
    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("photoBtnCamera").classList.remove("filled");
    document.getElementById("photoBtnGaleria").classList.remove("filled");
    const ocrStatusEl = document.getElementById("ocrStatus");
    ocrStatusEl.style.display = "none";
    ocrStatusEl.textContent = "";
  }

  // O rótulo (label) aponta para o input via "for", então o navegador abre o
  // seletor de arquivo nativamente, sem depender de JavaScript disparar o clique.
  function handlePhotoFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingPhoto = reader.result;
      const img = document.getElementById("photoPreview");
      img.src = pendingPhoto;
      img.style.display = "block";
      document.getElementById("photoBtnCamera").classList.add("filled");
      document.getElementById("photoBtnGaleria").classList.add("filled");
      lerComprovantePorOCR(pendingPhoto);
    };
    reader.onerror = () => showBanner("err", "Não foi possível ler a imagem.");
    reader.readAsDataURL(file);
  }
  document.getElementById("fPhotoCamera").addEventListener("change", (e) => {
    handlePhotoFile(e.target.files && e.target.files[0]);
  });
  document.getElementById("fPhotoGaleria").addEventListener("change", (e) => {
    handlePhotoFile(e.target.files && e.target.files[0]);
  });

  // --- Leitura automática do comprovante (OCR) ---
  // Lê o texto da foto para tentar preencher Data, Valor e Despesa.
  // O usuário sempre confere e pode editar antes de salvar.
  function parseValorFromText(text) {
    // Captura números no formato 1.234,56 ou 123,45 — padrão de valores em reais
    const matches = [...text.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map((m) => m[1]);
    if (matches.length === 0) return null;
    // Prioriza um valor que apareça perto da palavra "total"
    const lowerText = text.toLowerCase();
    let best = null;
    for (const m of matches) {
      const idx = lowerText.indexOf(m.toLowerCase());
      const windowStart = Math.max(0, idx - 25);
      const contexto = lowerText.slice(windowStart, idx);
      if (contexto.includes("total")) { best = m; break; }
    }
    // Sem pista de "total": usa o maior valor encontrado (geralmente é o total da compra)
    if (!best) {
      best = matches.reduce((a, b) => {
        const na = parseFloat(a.replace(/\./g, "").replace(",", "."));
        const nb = parseFloat(b.replace(/\./g, "").replace(",", "."));
        return nb > na ? b : a;
      });
    }
    return parseFloat(best.replace(/\./g, "").replace(",", "."));
  }

  function parseDataFromText(text) {
    const m = text.match(/(\d{2})[\/\-.](\d{2})[\/\-.](\d{4})/);
    if (!m) return null;
    const [, dd, mm, yyyy] = m;
    const mesNum = parseInt(mm, 10);
    const diaNum = parseInt(dd, 10);
    if (mesNum < 1 || mesNum > 12 || diaNum < 1 || diaNum > 31) return null;
    return `${yyyy}-${mm}-${dd}`;
  }

  function pareceTextoValido(linha) {
    // Filtro de qualidade: descarta linhas que parecem "lixo" de OCR
    // (muitas palavras soltas de 1 letra, sinal de leitura ruim)
    const palavras = linha.split(/\s+/).filter(Boolean);
    if (palavras.length === 0) return false;
    const palavrasCurtas = palavras.filter((p) => p.replace(/[^A-Za-zÀ-ÿ0-9]/g, "").length <= 1).length;
    if (palavrasCurtas / palavras.length > 0.3) return false;
    // Precisa ter pelo menos uma palavra "de verdade" (3+ letras)
    const temPalavraDeVerdade = palavras.some((p) => p.replace(/[^A-Za-zÀ-ÿ]/g, "").length >= 3);
    return temPalavraDeVerdade;
  }

  function parseEstabelecimentoFromText(text) {
    const linhas = text.split("\n").map((l) => l.trim()).filter(Boolean);
    for (const linha of linhas.slice(0, 6)) {
      // Pula linhas que são só números, datas ou símbolos
      if (/^[\d\s\/\-.,:R$]+$/.test(linha)) continue;
      if (linha.length < 3) continue;
      if (!pareceTextoValido(linha)) continue;
      return linha.slice(0, 60);
    }
    return null;
  }

  function parseCupomFromText(text) {
    const m = text.match(/(cupom[^\d]{0,15}\d{3,}|cfe[^\d]{0,15}\d{3,}|coo[^\d]{0,15}\d{3,})/i);
    return m ? m[1].replace(/\s+/g, " ").trim() : null;
  }

  async function lerComprovantePorOCR(dataUrl) {
    const statusEl = document.getElementById("ocrStatus");
    if (typeof Tesseract === "undefined") return; // OCR indisponível (ex: sem internet) — segue sem travar o app
    statusEl.style.display = "block";
    statusEl.textContent = "🔎 Lendo comprovante...";
    try {
      const { data: { text } } = await Tesseract.recognize(dataUrl, "por");
      let achouAlgo = false;

      const valor = parseValorFromText(text);
      const fValor = document.getElementById("fValor");
      if (valor && !fValor.value) { fValor.value = valor.toFixed(2); achouAlgo = true; }

      const data = parseDataFromText(text);
      const fData = document.getElementById("fData");
      if (data) { fData.value = data; achouAlgo = true; }

      const estabelecimento = parseEstabelecimentoFromText(text);
      const fDespesa = document.getElementById("fDespesa");
      if (estabelecimento && !fDespesa.value) { fDespesa.value = estabelecimento; achouAlgo = true; }

      const cupom = parseCupomFromText(text);
      const fObs = document.getElementById("fObs");
      if (cupom && !fObs.value) { fObs.value = cupom; achouAlgo = true; }

      statusEl.style.display = "none";
      if (achouAlgo) {
        showBanner("ok", "Comprovante lido! Confira os dados antes de registrar.");
      } else {
        showBanner("err", "Não consegui identificar os dados automaticamente — preencha manualmente.");
      }
    } catch (e) {
      statusEl.style.display = "none";
      // Falha na leitura não deve travar o fluxo — o usuário preenche na mão
    }
  }

  document.getElementById("backupBtn").addEventListener("click", () => {
    if (records.length === 0) {
      showBanner("err", "Nenhum lançamento para salvar ainda.");
      return;
    }
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backup_despesas_${todayISO()}.json`;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    showBanner("ok", "Backup baixado — guarde este arquivo para não perder os dados.");
  });

  document.getElementById("restoreBtn").addEventListener("click", () => {
    document.getElementById("restoreInput").click();
  });

  document.getElementById("restoreInput").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const loaded = JSON.parse(reader.result);
        if (!Array.isArray(loaded)) throw new Error("formato inválido");
        const existingIds = new Set(records.map(r => r.id));
        const merged = records.concat(loaded.filter(r => r && r.id && !existingIds.has(r.id)));
        records = merged;
        saveRecords();
        render();
        showBanner("ok", `Backup carregado (${loaded.length} lançamento(s)).`);
      } catch (err) {
        showBanner("err", "Arquivo de backup inválido.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const despesa = document.getElementById("fDespesa").value.trim();
    const valorRaw = document.getElementById("fValor").value;
    if (!despesa || !valorRaw) {
      showBanner("err", "Preencha despesa e valor.");
      return;
    }
    const record = {
      id: uid(),
      data: document.getElementById("fData").value || todayISO(),
      despesa,
      observacao: document.getElementById("fObs").value.trim(),
      valor: parseFloat(String(valorRaw).replace(",", ".")) || 0,
      photo: pendingPhoto,
      criadoEm: new Date().toISOString(),
    };
    records.unshift(record);
    const ok = saveRecords();
    resetForm();
    render();

    if (record.photo) {
      // Gera e baixa o PDF do comprovante automaticamente. Se o Chrome
      // estiver configurado para salvar downloads direto na pasta
      // "comprovantes", o arquivo já cai lá sem precisar de mais nada.
      await downloadReceiptAsPdf(record);
      showBanner(ok ? "ok" : "err", ok
        ? "Despesa registrada e comprovante em PDF baixado."
        : "Registrado nesta sessão (PDF baixado), mas não foi possível salvar de forma permanente — baixe o backup agora.");
    } else {
      showBanner(ok ? "ok" : "err", ok
        ? "Despesa registrada. Baixe o backup regularmente para não perder os dados."
        : "Registrado nesta sessão, mas não foi possível salvar de forma permanente — baixe o backup agora.");
    }
  });

  function dataUrlExt(dataUrl) {
    const match = /^data:image\/(\w+);base64,/.exec(dataUrl || "");
    if (!match) return "jpeg";
    const t = match[1].toLowerCase();
    return t === "jpg" ? "jpeg" : (t === "jpeg" || t === "png" || t === "gif") ? t : "jpeg";
  }

  document.getElementById("exportBtn").addEventListener("click", async () => {
    if (records.length === 0) return;
    const exportBtn = document.getElementById("exportBtn");
    exportBtn.disabled = true;
    exportBtn.textContent = "Gerando...";
    try {
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("Despesas");
      sheet.columns = [
        { header: "Data", key: "data", width: 12 },
        { header: "Despesa", key: "despesa", width: 26 },
        { header: "Observação", key: "obs", width: 32 },
        { header: "Valor", key: "valor", width: 14 },
        { header: "Comprovante", key: "comp", width: 22 },
      ];
      sheet.getRow(1).font = { bold: true };

      records.forEach((r) => {
        const row = sheet.addRow({
          data: r.data,
          despesa: r.despesa,
          obs: r.observacao,
          valor: r.valor,
          comp: r.photo ? "" : "Sem comprovante",
        });
        if (r.photo) {
          row.height = 80;
          const imageId = workbook.addImage({ base64: r.photo, extension: dataUrlExt(r.photo) });
          const rowNumber = row.number;
          sheet.addImage(imageId, {
            tl: { col: 4, row: rowNumber - 1 },
            ext: { width: 110, height: 100 },
          });
        }
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `despesas_${todayISO()}.xlsx`;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      showBanner("ok", "Planilha gerada com as fotos já dentro das células.");
    } catch (e) {
      showBanner("err", "Não foi possível gerar o arquivo.");
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = "📊 Exportar Excel";
    }
  });

  function getImageDimensions(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function slugify(text) {
    return String(text)
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 40) || "despesa";
  }

  async function downloadReceiptAsPdf(record) {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const pageWidth = doc.internal.pageSize.getWidth();
      const marginX = 15;

      doc.setFont("helvetica", "bold");
      doc.setFontSize(15);
      doc.setTextColor(20, 20, 20);
      doc.text("Nex Agro", marginX, 18);
      doc.setFontSize(11);
      doc.setFont("helvetica", "normal");
      doc.text("Comprovante de Despesa", marginX, 25);
      doc.setDrawColor(114, 189, 3);
      doc.setLineWidth(0.8);
      doc.line(marginX, 29, pageWidth - marginX, 29);

      let y = 40;
      const rows = [
        ["Data", new Date(record.data + "T00:00:00").toLocaleDateString("pt-BR")],
        ["Despesa", record.despesa],
        ["Observação", record.observacao || "-"],
        ["Valor", formatBRL(record.valor)],
      ];
      doc.setFontSize(11);
      rows.forEach(([label, value]) => {
        doc.setFont("helvetica", "bold");
        doc.setTextColor(90, 90, 90);
        doc.text(label + ":", marginX, y);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(20, 20, 20);
        doc.text(String(value), marginX + 32, y);
        y += 7;
      });

      y += 4;
      if (record.photo) {
        const dims = await getImageDimensions(record.photo);
        const maxW = pageWidth - marginX * 2;
        const maxH = doc.internal.pageSize.getHeight() - y - 15;
        let w = maxW;
        let h = (w * dims.height) / dims.width;
        if (h > maxH) {
          h = maxH;
          w = (h * dims.width) / dims.height;
        }
        const fmt = record.photo.startsWith("data:image/png") ? "PNG" : "JPEG";
        doc.addImage(record.photo, fmt, marginX, y, w, h);
      } else {
        doc.setTextColor(140, 140, 140);
        doc.text("Sem imagem anexada.", marginX, y);
      }

      const filename = `comprovante_${slugify(record.despesa)}_${record.data}.pdf`;
      doc.save(filename);
      showBanner("ok", "Comprovante em PDF baixado.");
    } catch (e) {
      showBanner("err", "Não foi possível gerar o PDF.");
    }
  }

  function render() {
    const total = records.reduce((s, r) => s + (r.valor || 0), 0);
    document.getElementById("totalValue").textContent = formatBRL(total);
    document.getElementById("exportBtn").disabled = records.length === 0;

    const listArea = document.getElementById("listArea");
    if (records.length === 0) {
      listArea.innerHTML = `<div class="empty">Nenhuma despesa registrada ainda. Preencha o formulário acima para começar.</div>`;
      return;
    }
    const sorted = [...records].sort((a, b) =>
      (b.data || "").localeCompare(a.data || "") || (b.criadoEm || "").localeCompare(a.criadoEm || "")
    );
    listArea.innerHTML = `<div class="list">${sorted.map(r => rowHtml(r)).join("")}</div>`;

    listArea.querySelectorAll("[data-thumb]").forEach(el => {
      el.addEventListener("click", () => openLightbox(el.getAttribute("data-thumb")));
    });
    listArea.querySelectorAll("[data-pdf]").forEach(el => {
      el.addEventListener("click", () => {
        const rec = records.find(r => r.id === el.getAttribute("data-pdf"));
        if (rec) downloadReceiptAsPdf(rec);
      });
    });
    listArea.querySelectorAll("[data-del]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-del");
        if (confirmDeleteId === id) {
          records = records.filter(r => r.id !== id);
          saveRecords();
          confirmDeleteId = null;
          render();
          showBanner("ok", "Lançamento excluído.");
        } else {
          confirmDeleteId = id;
          render();
        }
      });
    });
    listArea.querySelectorAll("[data-cancel]").forEach(el => {
      el.addEventListener("click", () => { confirmDeleteId = null; render(); });
    });
  }

  function rowHtml(r) {
    const dateFmt = new Date(r.data + "T00:00:00").toLocaleDateString("pt-BR");
    const thumb = r.photo
      ? `<img class="thumb" data-thumb="${r.photo}" src="${r.photo}" alt="Comprovante" />`
      : `<div class="thumb-empty">🧾</div>`;
    const actions = confirmDeleteId === r.id
      ? `<div class="row-actions">
          <span style="font-size:12px;color:var(--muted);">Excluir?</span>
          <button class="link-btn danger" data-del="${r.id}">Sim, excluir</button>
          <button class="link-btn" data-cancel="${r.id}">Cancelar</button>
        </div>`
      : `<div class="row-actions">
          ${r.photo ? `<button class="link-btn" data-pdf="${r.id}">⬇ PDF</button>` : ""}
          <button class="link-btn danger" data-del="${r.id}">🗑 Excluir</button>
        </div>`;
    return `<div class="row">
      ${thumb}
      <div class="row-body">
        <div class="row-top">
          <div class="row-title">${escapeHtml(r.despesa)}</div>
          <div class="row-value">${formatBRL(r.valor)}</div>
        </div>
        <div class="row-date">${dateFmt}</div>
        ${r.observacao ? `<div class="row-obs">${escapeHtml(r.observacao)}</div>` : ""}
        ${actions}
      </div>
    </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function openLightbox(src) {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }
  document.getElementById("lightbox").addEventListener("click", (e) => {
    if (e.target.id === "lightbox" || e.target.id === "closeLightbox") {
      document.getElementById("lightbox").style.display = "none";
    }
  });

  document.getElementById("fData").value = todayISO();
  loadRecords();
  render();
</script>
</body>
</html>
